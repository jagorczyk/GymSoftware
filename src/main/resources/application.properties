spring.application.name=gymManagement

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gym_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=8

app.jwt.secret=${JWT_SECRET:your-very-long-secret-key-your-very-long-secret-key}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.mfa.trusted-device-days=${MFA_TRUSTED_DEVICE_DAYS:30}

app.upload.max-bytes=${UPLOAD_MAX_BYTES:5242880}
app.auth.rate-limit.max-requests=${AUTH_RATE_LIMIT_MAX:30}
app.auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.google.client-id=${GOOGLE_CLIENT_ID:}

app.jobs.expire-passes-cron=${EXPIRE_PASSES_CRON:0 0 1 * * *}
app.jobs.expiring-notifications-cron=${EXPIRING_NOTIFICATIONS_CRON:0 0 8 * * *}
app.notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}

stripe.api.key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:5173/client/gyms/{gymId}/passes?success=true}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:5173/client/gyms/{gymId}/buy?canceled=true}
stripe.connect.application-fee-percent=${STRIPE_CONNECT_FEE_PERCENT:5}
stripe.connect.country=${STRIPE_CONNECT_COUNTRY:PL}

# SMTP Email Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
